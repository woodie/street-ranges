name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx eslint . && npx tsc --noEmit && npx html-validate public/
      - run: npm run test-js
      - name: Check public/main.js is built from src/
        run: npm run build && git diff --exit-code public/main.js
